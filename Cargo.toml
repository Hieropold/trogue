[package]
name = "trogue"
version = "0.2.4"
edition = "2024"
description = "A terminal-based client for viewing Steam achievements."
authors = ["Hieropold <hieropold@gmail.com>"]
license = "MIT"
repository = "https://github.com/Hieropold/trogue"
readme = "README.md"
keywords = ["steam", "achievements", "cli", "tui", "games"]
categories = ["command-line-utilities", "games-development"]


[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
ratatui = "0.30"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.4"
unicode-width = "0.2"

async-trait = "0.1.81"

[dev-dependencies]
gag = "1.0.0"
lazy_static = "1.4.0"
mockito = "1.4.0"

[package.metadata.deb]
copyright = "2025 Hieropold"
license-file = "LICENSE"
depends = "$auto"

# Deterministic lint policy: the single source of truth for lint levels,
# applied identically by `cargo clippy`, the git hooks, and CI. See
# "Safe Rust & Enforcement" in CLAUDE.md for the reasoning behind each entry.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Panic paths: a warn-level ratchet, not a wall. Tests are exempted via
# `#![cfg_attr(test, allow(...))]` in src/main.rs, since `[lints]` cannot
# be made cfg(test)-conditional.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Correctness / footguns worth hard-failing everywhere, including tests.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"