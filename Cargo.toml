[package]
name = "trogue"
version = "0.2.4"
edition = "2021"
description = "A terminal-based client for viewing Steam achievements."
authors = ["Hieropold <hieropold@gmail.com>"]
license = "MIT"
repository = "https://github.com/Hieropold/trogue"
readme = "README.md"
keywords = ["steam", "achievements", "cli", "tui", "games"]
categories = ["command-line-utilities", "games-development"]


[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
ratatui = "0.30"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.4"

async-trait = "0.1.81"

[dev-dependencies]
gag = "1.0.0"
lazy_static = "1.4.0"
mockito = "1.4.0"

[package.metadata.deb]
copyright = "2025 Hieropold"
license-file = "LICENSE"
depends = "$auto"